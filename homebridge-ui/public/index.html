<!--
  Settings page shown inside the Homebridge UI.

  Runs in an iframe the host provides; `homebridge.*` is injected by it. The
  host supplies Bootstrap and the active theme, so styling stays minimal.

  The settings are this page's own form (settings.js): one appliance at a
  time, picked from a list. Homebridge's generated form, which lists every
  plug one under the other, is kept hidden.
-->
<style>
  .om-hidden { display: none; }
  .om-hint   { font-size: .8rem; opacity: .7; }
  .om-tabs   { margin-bottom: 1rem; }
  .om-tabs .nav-link { cursor: pointer; }
  .om-table  { width: 100%; font-size: .9rem; font-variant-numeric: tabular-nums; border-collapse: collapse; }
  .om-table th, .om-table td { padding: .45rem .5rem; vertical-align: top; }
  /* The host greys every table cell out, with !important; not this table's. */
  .om-table td { color: inherit !important; font-weight: 400; font-size: .9rem; }
  .om-table th:not(:first-child), .om-table td:not(:first-child) { text-align: right; }
  .om-table thead th { background: rgba(128,128,128,.1); font-size: .72rem; font-weight: 600;
                       text-transform: uppercase; letter-spacing: .03em; padding-top: .55rem; padding-bottom: .55rem;
                       border-bottom: 1px solid rgba(128,128,128,.35); }
  .om-table thead th:first-child { border-top-left-radius: .375rem; }
  .om-table thead th:last-child { border-top-right-radius: .375rem; }
  .om-table tbody td:first-child { font-weight: 500; }
  .om-table tbody tr + tr td { border-top: 1px solid rgba(128,128,128,.15); }
  /* The checkboxes for resetting, shown only while picking. */
  .om-table .om-reset-pick { display: none; margin-right: .5rem; vertical-align: -.1em; }
  .om-table.om-picking .om-reset-pick { display: inline-block; }
  .om-reset { display: flex; justify-content: flex-end; margin-top: .5rem; }
  .om-table tfoot td { border-top: 1px solid rgba(128,128,128,.5); font-weight: 600; }
  .om-table tfoot td:first-child { text-transform: uppercase; font-size: .72rem; letter-spacing: .04em; padding-top: .55rem; }

  /* Dragging across the chart must not select the text around it. */
  #om-curve { user-select: none; -webkit-user-select: none; }

  .om-controls { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: .75rem; }
  .om-controls select { width: auto; }
  /* As wide as the appliance list on Settings, so switching tabs does not jump. */
  .om-controls #om-curve-plug { width: 14rem; max-width: 100%; }
  .om-form   { display: grid; grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr)); gap: .5rem; align-items: end; }
</style>
<script src="chart.js"></script>
<script src="settings.js"></script>

<ul class="nav nav-tabs om-tabs" role="tablist">
  <li class="nav-item"><button type="button" class="nav-link active" id="om-tab-settings" role="tab">Settings</button></li>
  <li class="nav-item"><button type="button" class="nav-link" id="om-tab-curve" role="tab">Power</button></li>
  <li class="nav-item"><button type="button" class="nav-link" id="om-tab-stats" role="tab">Statistics</button></li>
</ul>

<div class="card mb-3" id="om-settings-card">
  <div class="card-body" id="om-settings"></div>
</div>

<div class="card mb-3 om-hidden" id="om-curve-card">
  <div class="card-body">
    <div class="om-controls">
      <select class="form-select" id="om-curve-plug" aria-label="Appliance"></select>
      <select class="form-select" id="om-curve-hours" aria-label="Time">
        <option value="1">Last hour</option>
        <option value="6">Last 6 hours</option>
        <option value="12" selected>Last 12 hours</option>
        <option value="24">Last 24 hours</option>
        <option value="72">Last 3 days</option>
        <option value="168">Last 7 days</option>
        <option value="336">Last 14 days</option>
      </select>
      <button type="button" class="btn btn-outline-secondary" id="om-curve-reload">Reload</button>
    </div>
    <div id="om-curve"></div>
    <p class="om-hint mb-3" id="om-curve-help">
      Click a green level marker to make it a phase. Drag across a whole cycle to learn from it.
    </p>

    <div class="om-hidden mb-3" id="om-cycle-form">
      <h6 id="om-cycle-title">Marked</h6>
      <div class="d-flex gap-2 align-items-center">
        <button type="button" class="btn btn-sm btn-primary" id="om-cycle-learn">Learn from this cycle</button>
        <span class="om-hint" id="om-cycle-msg"></span>
      </div>
    </div>

    <div class="om-hidden" id="om-phase-form">
      <h6 id="om-phase-title">New phase</h6>
      <div class="om-form">
        <label class="form-label mb-0">Name
          <input class="form-control form-control-sm" id="om-phase-name" placeholder="Heating">
        </label>
        <label class="form-label mb-0">From (W)
          <input class="form-control form-control-sm" id="om-phase-min" type="number" min="0" step="any">
        </label>
        <label class="form-label mb-0">Below (W)
          <input class="form-control form-control-sm" id="om-phase-max" type="number" min="0" step="any" placeholder="no limit">
        </label>
        <label class="form-label mb-0">On after (s)
          <input class="form-control form-control-sm" id="om-phase-on" type="number" min="0" value="5">
        </label>
        <label class="form-label mb-0">Off after (s)
          <input class="form-control form-control-sm" id="om-phase-off" type="number" min="0" value="30">
        </label>
        <div class="form-check mb-1">
          <input class="form-check-input" type="checkbox" id="om-phase-sensor" checked>
          <label class="form-check-label" for="om-phase-sensor">Switch in HomeKit</label>
        </div>
        <div class="form-check mb-1">
          <input class="form-check-input" type="checkbox" id="om-phase-count">
          <label class="form-check-label" for="om-phase-count">Count in statistics</label>
        </div>
      </div>
      <div class="mt-2 d-flex gap-2 align-items-center">
        <button type="button" class="btn btn-sm btn-primary" id="om-phase-add">Add phase</button>
        <span class="om-hint" id="om-phase-msg"></span>
      </div>
    </div>
  </div>
</div>

<div class="card mb-3 om-hidden" id="om-stats-card">
  <div class="card-body">
    <h5 class="card-title mb-4">Energy and counts</h5>
    <div id="om-stats"></div>
    <p class="om-hint mb-0" id="om-stats-note">Saved every five minutes.</p>
    <p class="om-hint mb-0 om-hidden" id="om-stats-none">No plugs configured yet.</p>
  </div>
</div>

<script>
  (async () => {
    homebridge.hideSchemaForm();
    const settingsStyle = document.createElement('style');
    settingsStyle.textContent = window.ApplianceSettings.css;
    document.head.append(settingsStyle);
    const paired = await homebridge.request('/paired').catch(() => []);
    const settings = await window.ApplianceSettings.mount(document.getElementById('om-settings'), { homebridge, paired });

    /** kWh from Wh, with as many decimals as are worth reading. */
    const kwh = (wattHours) => {
      if (wattHours === null) {
        return '';
      }
      const value = wattHours / 1000;
      return `${value.toFixed(value < 10 ? 2 : 1)} kWh`;
    };

    /** "45 min", "2 h 5 min". */
    const duration = (seconds) => {
      const minutes = Math.round(seconds / 60);
      return minutes < 60 ? `${minutes} min` : `${Math.floor(minutes / 60)} h${minutes % 60 ? ` ${minutes % 60} min` : ''}`;
    };

    function cell(row, text, tag = 'td') {
      const element = document.createElement(tag);
      element.textContent = text;
      row.append(element);
    }

    async function showStats() {
      const box = document.getElementById('om-stats');
      const [config] = await homebridge.getPluginConfig();
      const devices = (config?.devices ?? [])
        .filter((device) => typeof device?.name === 'string' && device.name.trim())
        .map((device) => ({ name: device.name.trim(), phases: device.phases ?? [] }));
      document.getElementById('om-stats-none').classList.toggle('om-hidden', devices.length > 0);
      document.getElementById('om-stats-note').classList.toggle('om-hidden', devices.length === 0);
      box.innerHTML = '';
      if (devices.length === 0) {
        return;
      }

      let table;
      try {
        table = await homebridge.request('/statistics', { devices });
      } catch (error) {
        box.textContent = `Could not read the statistics: ${error?.message ?? error}`;
        return;
      }

      const element = document.createElement('table');
      element.className = 'om-table';
      const head = element.createTHead().insertRow();
      cell(head, 'Appliance', 'th');
      for (const { label } of table.periods) {
        cell(head, label, 'th');
      }
      cell(head, 'Last Cycle', 'th');
      cell(head, 'Count', 'th');

      const body = element.createTBody();
      for (const [index, { name, values, partial }] of table.rows.entries()) {
        const row = body.insertRow();
        cell(row, name);
        const pick = document.createElement('span');
        pick.className = 'om-reset-pick form-check-inline';
        const box = document.createElement('input');
        box.type = 'checkbox';
        box.className = 'form-check-input';
        box.value = name;
        box.setAttribute('aria-label', `Reset ${name}`);
        pick.append(box);
        row.lastElementChild.prepend(pick);
        values.forEach((value, column) => cell(row, `${kwh(value)}${partial[column] ? ' ¹' : ''}`));
        const last = table.lastCycles?.[index];
        cell(row, last ? kwh(last.wattHours) : '–');
        if (last) {
          const ended = new Date(last.endedAt).toLocaleString([], { weekday: 'short', hour: '2-digit', minute: '2-digit' });
          row.lastElementChild.title = `${ended} · ${duration(last.seconds)}`;
        }
        const { label, count } = table.counts[index];
        cell(row, `${count} × ${label}`);
      }
      const { total } = table;
      const foot = element.createTFoot().insertRow();
      cell(foot, 'Total');
      total.values.forEach((value, column) => {
        const marks = `${total.partial[column] ? ' ¹' : ''}${total.missing[column] ? ' *' : ''}`;
        cell(foot, value === null ? '' : `${kwh(value)}${marks}`);
      });
      cell(foot, ''); // last cycles of different appliances are no total
      cell(foot, ''); // counts of different things do not add up
      box.append(element);
      const reset = document.createElement('div');
      reset.className = 'om-reset';
      reset.append(resetControl(element));
      box.append(reset);

      const shown = (flags) => total.values.some((value, column) => value !== null && flags[column]);
      for (const [flags, text] of [
        [total.partial, '¹ Part of the year, from the day the plug was added.'],
        [total.missing, '* Without plugs not counted for the whole period.'],
      ]) {
        if (shown(flags)) {
          const note = document.createElement('p');
          note.className = 'om-hint mt-2 mb-1';
          note.textContent = text;
          box.append(note);
        }
      }
    }

    /**
     * One button for resetting any of the appliances, in three clicks: show
     * a checkbox per appliance, then ask, then reset the ones ticked. Asked
     * on the button itself rather than with confirm(), which the host's
     * iframe may not be allowed to show. Left alone for a while, it goes
     * back to the start with nothing ticked.
     */
    function resetControl(element) {
      const IDLE_MS = 20_000;
      const SURE_MS = 5000;
      const button = document.createElement('button');
      button.type = 'button';
      let step = 'idle';
      let timer = null;
      const boxes = () => [...element.querySelectorAll('.om-reset-pick input')];
      const picked = () => boxes().filter((box) => box.checked).map((box) => box.value);

      function show(next) {
        step = next;
        clearTimeout(timer);
        element.classList.toggle('om-picking', step !== 'idle');
        button.disabled = step === 'pick' && picked().length === 0;
        button.className = `btn btn-sm ${step === 'sure' ? 'btn-danger' : 'btn-outline-danger'}`;
        button.textContent = { idle: 'Reset data', pick: 'Reset selected', sure: 'SURE?' }[step];
        if (step === 'idle') {
          boxes().forEach((box) => { box.checked = false; });
        } else {
          timer = setTimeout(() => show('idle'), step === 'sure' ? SURE_MS : IDLE_MS);
        }
      }

      element.addEventListener('change', (event) => {
        if (event.target.closest('.om-reset-pick')) {
          show('pick'); // and the time starts again
        }
      });
      button.addEventListener('click', async () => {
        if (step !== 'sure') {
          show(step === 'idle' ? 'pick' : 'sure');
          return;
        }
        clearTimeout(timer);
        const names = picked();
        button.disabled = true;
        button.textContent = '…';
        try {
          await homebridge.request('/reset', { names });
          homebridge.toast.success(`${names.join(', ')}: counting again from now.`, 'Data reset');
          await showStats();
        } catch (error) {
          homebridge.toast.error(error?.message ?? String(error), 'Reset failed');
          show('idle');
        }
      });
      show('idle');
      return button;
    }

    // ---- Power ---------------------------------------------------------------

    const chartStyle = document.createElement('style');
    chartStyle.textContent = window.ApplianceChart.css;
    document.head.append(chartStyle);
    const clock = (ms, long) =>
      new Date(ms).toLocaleString([], long
        ? { weekday: 'short', hour: '2-digit', minute: '2-digit' }
        : { hour: '2-digit', minute: '2-digit', second: '2-digit' });

    let current = null; // { name }

    async function configuredPlugs() {
      const [config] = await homebridge.getPluginConfig();
      return (config?.devices ?? []).filter((device) => typeof device?.name === 'string' && device.name.trim());
    }

    /** Fills the Power tab's list, on the appliance Settings shows, so both tabs stay on the same one. */
    async function fillPlugs() {
      const select = document.getElementById('om-curve-plug');
      const chosen = settings.selectedName()?.trim() || select.value;
      select.innerHTML = '';
      const names = (await configuredPlugs())
        .map((device) => device.name.trim())
        .sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'base', numeric: true }));
      for (const name of names) {
        const option = document.createElement('option');
        option.value = option.textContent = name;
        select.append(option);
      }
      if ([...select.options].some((option) => option.value === chosen)) {
        select.value = chosen;
      }
    }

    async function showCurve() {
      const box = document.getElementById('om-curve');
      const name = document.getElementById('om-curve-plug').value;
      const hours = Number(document.getElementById('om-curve-hours').value);
      box.innerHTML = '';
      // A stretch marked before was on the chart as it was, maybe of another appliance.
      marked = null;
      document.getElementById('om-cycle-form').classList.add('om-hidden');
      if (!name) {
        box.textContent = 'No plugs configured yet.';
        return;
      }
      const device = (await configuredPlugs()).find((d) => d.name.trim() === name);
      const phases = device?.phases ?? [];
      let curve;
      try {
        curve = await homebridge.request('/curve', { name, hours, phases });
      } catch (error) {
        box.textContent = `Could not read the recording: ${error?.message ?? error}`;
        return;
      }
      if (curve.points.length === 0) {
        box.textContent = 'Nothing recorded for this plug in that time. Is "Record power readings" on?';
        return;
      }
      draw(box, name, curve, phases);
    }

    function draw(box, name, curve, phases) {
      const chart = window.ApplianceChart.render({ ...curve, phases });
      current = { name };
      box.innerHTML = chart.svg;
      const element = box.querySelector('svg');
      element.setAttribute('aria-label', `Power of ${name}`);
      const long = curve.to - curve.from > 36 * 3_600_000;

      // Levels: click to make one a phase.
      for (const marker of element.querySelectorAll('[data-level]')) {
        const level = curve.levels[Number(marker.dataset.level)];
        marker.addEventListener('click', () =>
          offerPhase(level.minWatts, level.maxWatts, `the ${chart.watts(level.watts)} level`));
      }

      const toChart = (event) => {
        const box = element.getBoundingClientRect();
        return {
          x: ((event.clientX - box.left) / box.width) * chart.width,
          y: ((event.clientY - box.top) / box.height) * chart.height,
        };
      };
      const hoverLine = element.querySelector('#om-hover-line');
      const tip = element.querySelector('#om-hover-tip');
      const tipBox = tip.querySelector('rect');
      const tipText = tip.querySelector('text');
      const pick = element.querySelector('#om-pick');
      const inPlot = ({ x, y }) =>
        x >= chart.xOf(curve.from) && x <= chart.xOf(curve.to) && y >= chart.plotTop && y <= chart.plotBottom;

      // Pointing shows the time and the reading there.
      const hover = (point) => {
        if (!inPlot(point)) {
          hoverLine.setAttribute('visibility', 'hidden');
          tip.setAttribute('visibility', 'hidden');
          return;
        }
        const at = chart.timeOf(point.x);
        const value = chart.valueAt(at);
        hoverLine.setAttribute('x1', point.x);
        hoverLine.setAttribute('x2', point.x);
        hoverLine.setAttribute('visibility', 'visible');
        tipText.textContent = `${clock(at, long)}  ${value === null ? '–' : chart.watts(value)}`;
        const width = tipText.getComputedTextLength() + 16;
        const left = point.x + width + 12 > chart.xOf(curve.to) ? point.x - width - 8 : point.x + 8;
        tip.setAttribute('transform', `translate(${left},${chart.plotTop + 6})`);
        tipBox.setAttribute('width', width);
        tipText.setAttribute('x', 8);
        tip.setAttribute('visibility', 'visible');
      };

      // Dragging across the chart picks a stretch of time.
      let start = null;
      element.addEventListener('pointerdown', (event) => {
        if (event.target.closest('[data-level]')) {
          return; // a click on a level, not a drag
        }
        // A drag here marks a stretch of time, not the text around the chart.
        event.preventDefault();
        const point = toChart(event);
        if (!inPlot(point)) {
          return;
        }
        start = point.x;
        element.setPointerCapture(event.pointerId);
        pick.setAttribute('x', start);
        pick.setAttribute('width', 0);
        pick.setAttribute('visibility', 'visible');
      });
      element.addEventListener('pointermove', (event) => {
        const point = toChart(event);
        // On a level marker, which is clicked rather than read: no time line.
        hover(start === null && event.target.closest('[data-level]') ? { x: -1, y: -1 } : point);
        if (start === null) {
          return;
        }
        pick.setAttribute('x', Math.min(start, point.x));
        pick.setAttribute('width', Math.abs(point.x - start));
      });
      element.addEventListener('pointerleave', () => hover({ x: -1, y: -1 }));
      element.addEventListener('pointerup', async (event) => {
        if (start === null) {
          return;
        }
        const end = toChart(event).x;
        const [a, b] = [start, end].sort((p, q) => p - q);
        start = null;
        if (b - a < 4) {
          // A click rather than a drag: the marking goes, and with it what to do with it.
          pick.setAttribute('visibility', 'hidden');
          marked = null;
          document.getElementById('om-cycle-form').classList.add('om-hidden');
          return;
        }
        const pickedFrom = chart.timeOf(a);
        const pickedTo = chart.timeOf(b);
        offerCycle({ from: Math.round(pickedFrom), to: Math.round(pickedTo) },
          `${clock(pickedFrom, long)} to ${clock(pickedTo, long)}`);
      });
    }

    /** The stretch dragged across, to learn from as a cycle. */
    let marked = null;

    /** A drag marks a cycle to learn from; a level clicked makes a phase. One at a time. */
    function offerCycle(stretch, source) {
      marked = stretch;
      document.getElementById('om-phase-form').classList.add('om-hidden');
      document.getElementById('om-cycle-form').classList.remove('om-hidden');
      document.getElementById('om-cycle-title').textContent = `Marked ${source}`;
      document.getElementById('om-cycle-msg').textContent = '';
    }

    function offerPhase(minWatts, maxWatts, source) {
      marked = null;
      document.getElementById('om-cycle-form').classList.add('om-hidden');
      document.getElementById('om-pick')?.setAttribute('visibility', 'hidden');
      document.getElementById('om-phase-form').classList.remove('om-hidden');
      document.getElementById('om-phase-title').textContent = `New phase from ${source}`;
      document.getElementById('om-phase-min').value = minWatts;
      document.getElementById('om-phase-max').value = maxWatts;
      document.getElementById('om-phase-msg').textContent = '';
      document.getElementById('om-phase-name').focus();
    }

    document.getElementById('om-cycle-learn').addEventListener('click', async (event) => {
      const button = event.currentTarget;
      const message = document.getElementById('om-cycle-msg');
      if (!marked || !current) {
        return;
      }
      button.disabled = true;
      message.textContent = 'Learning…';
      try {
        const result = await homebridge.request('/learn', { name: current.name, ...marked });
        message.textContent = '';
        homebridge.toast.success(result.message, `${current.name}: learned`);
      } catch (error) {
        message.textContent = error?.message ?? String(error);
      } finally {
        button.disabled = false;
      }
    });

    document.getElementById('om-phase-add').addEventListener('click', async () => {
      const message = document.getElementById('om-phase-msg');
      const name = document.getElementById('om-phase-name').value.trim();
      const minWatts = Number(document.getElementById('om-phase-min').value);
      const maxText = document.getElementById('om-phase-max').value.trim();
      const maxWatts = maxText === '' ? undefined : Number(maxText);
      const minSeconds = Number(document.getElementById('om-phase-on').value);
      const holdSeconds = Number(document.getElementById('om-phase-off').value);
      const sensor = document.getElementById('om-phase-sensor').checked;
      const count = document.getElementById('om-phase-count').checked;
      if (!name) {
        message.textContent = 'Give the phase a name.';
        return;
      }
      if (!(minWatts >= 0) || (maxWatts !== undefined && !(maxWatts > minWatts))) {
        message.textContent = '"Below" has to be more than "From", or empty for no upper end.';
        return;
      }
      const configs = await homebridge.getPluginConfig();
      const device = (configs[0]?.devices ?? []).find((d) => d?.name?.trim() === current?.name);
      if (!device) {
        message.textContent = 'That plug is no longer in the settings.';
        return;
      }
      device.phases ??= [];
      if (device.phases.some((phase) => phase?.name?.trim() === name)) {
        message.textContent = `${current.name} already has a phase called "${name}".`;
        return;
      }
      device.phases.push({ name, minWatts, ...(maxWatts === undefined ? {} : { maxWatts }), minSeconds, holdSeconds, sensor, count });
      await homebridge.updatePluginConfig(configs);
      message.textContent = 'Added. Save and restart the child bridge to use it.';
      document.getElementById('om-phase-name').value = '';
      void showCurve();
    });

    document.getElementById('om-curve-plug').addEventListener('change', (event) => {
      settings.select(event.target.value);
      void showCurve();
    });
    document.getElementById('om-curve-hours').addEventListener('change', () => void showCurve());
    document.getElementById('om-curve-reload').addEventListener('click', () => void showCurve());

    // ---- Tabs ----------------------------------------------------------------

    /**
     * Switch between the tabs. Each is read afresh on every visit: the plugin
     * keeps writing what Power and Statistics show while the page is open, and
     * a phase added on the Power tab belongs in Settings.
     */
    const TABS = { settings: 'om-settings-card', curve: 'om-curve-card', stats: 'om-stats-card' };
    function showTab(name) {
      for (const [tab, panel] of Object.entries(TABS)) {
        document.getElementById(`om-tab-${tab}`).classList.toggle('active', tab === name);
        if (panel) {
          document.getElementById(panel).classList.toggle('om-hidden', tab !== name);
        }
      }
      if (name === 'settings') {
        void settings.reload();
        return;
      }
      if (name === 'curve') {
        void fillPlugs().then(showCurve);
      } else {
        void showStats();
      }
    }
    for (const tab of Object.keys(TABS)) {
      document.getElementById(`om-tab-${tab}`).addEventListener('click', () => showTab(tab));
    }
  })();
</script>
